name: Container image

# Builds the TRIARCHY task image from the Dockerfile. Pull requests that touch
# the image inputs build it without pushing; version tags (vX.Y.Z) and manual
# runs push it to ghcr.io/aglucaci/triarchy.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - locks/environment.linux-64.lock.txt
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aglucaci/triarchy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: TRIARCHY_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
