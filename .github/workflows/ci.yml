name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m py_compile triarchy scripts/*.py workflow/scripts/*.py

      - name: Check shell syntax
        run: |
          for f in install.sh setup_and_run_triarchy.sh scripts/*.sh; do
            bash -n "$f"
          done

      - name: CLI entry point
        run: ./triarchy --help

      - name: Validate CITATION.cff
        run: |
          pip install --quiet cffconvert
          cffconvert --validate
