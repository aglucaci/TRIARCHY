name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff shellcheck-py cffconvert

      - name: Ruff
        run: ruff check .

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh

      - name: Validate CITATION.cff
        run: cffconvert --validate

      - name: Validate nextflow_schema.json
        run: python -m json.tool nextflow_schema.json > /dev/null

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Unit tests
        run: pytest

      - name: CLI entry point
        run: |
          ./triarchy --help
          ./triarchy --version

  nextflow-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Nextflow
        run: |
          NXF_VER="$(tr -d '[:space:]' < .nextflow-version)"
          export NXF_VER
          echo "NXF_VER=${NXF_VER}" >> "$GITHUB_ENV"
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Resolve every profile
        run: |
          for profile in laptop local workstation high_memory docker apptainer singularity slurm cloud; do
            echo "::group::${profile}"
            nextflow config -profile "${profile}" > /dev/null
            echo "::endgroup::"
          done

      - name: Lint workflow scripts
        run: nextflow lint main.nf modules/local
