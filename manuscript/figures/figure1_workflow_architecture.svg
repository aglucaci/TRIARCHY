<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1150" viewBox="0 0 2000 1150" role="img" aria-labelledby="title desc">
<title id="title">TRIARCHY control-aware cross-assay evidence framework</title><desc id="desc">Experimental inputs, assay-native processing, two-stage evidence model, and interpretable outputs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#4B5563"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#111827" flood-opacity=".1"/></filter><style>.panel{fill:#fff;stroke:#CBD5E1;stroke-width:2}.label{font:700 34px Arial,sans-serif;fill:#111827}.heading{font:700 27px Arial,sans-serif;fill:#111827}.body{font:400 22px Arial,sans-serif;fill:#334155}.small{font:400 19px Arial,sans-serif;fill:#475569}.bold{font-weight:700;fill:#111827}.arrow{fill:none;stroke:#4B5563;stroke-width:3;marker-end:url(#arrow)}.thin{fill:none;stroke:#64748B;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="2000" height="1150" fill="#F8FAFC"/>

<!-- A: experimental design -->
<rect class="panel" x="40" y="45" width="590" height="470" rx="20" filter="url(#shadow)"/><text class="label" x="68" y="93">A</text><text class="heading" x="125" y="91">Experimental design</text>
<rect x="90" y="135" width="220" height="92" rx="14" fill="#E8F2FA" stroke="#0072B2" stroke-width="2"/><text class="body bold" x="200" y="174" text-anchor="middle">Biological samples</text><text class="small" x="200" y="204" text-anchor="middle">WMS · 16S · ITS</text>
<rect x="360" y="135" width="220" height="92" rx="14" fill="#FDEEE8" stroke="#D55E00" stroke-width="2"/><text class="body bold" x="470" y="174" text-anchor="middle">Linked controls</text><text class="small" x="470" y="204" text-anchor="middle">field → run</text>
<path class="thin" d="M200 227V275H306"/><path class="thin" d="M470 227V275H364"/>
<rect x="150" y="275" width="370" height="112" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text class="body bold" x="335" y="315" text-anchor="middle">Sample–control graph</text><text class="small" x="335" y="346" text-anchor="middle">stage-, assay- and batch-specific</text><text class="small" x="335" y="374" text-anchor="middle">relationships validated before analysis</text>

<!-- B: native pipelines -->
<rect class="panel" x="660" y="45" width="1300" height="470" rx="20" filter="url(#shadow)"/><text class="label" x="688" y="93">B</text><text class="heading" x="745" y="91">Assay-native processing preserves non-equivalent measurements</text>
<rect x="710" y="140" width="360" height="280" rx="18" fill="#E8F2FA" stroke="#0072B2" stroke-width="3"/><circle cx="770" cy="194" r="29" fill="#0072B2"/><text x="770" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">W</text><text class="heading" x="820" y="202">WMS</text><text class="body" x="750" y="255">fastp quality control</text><text class="body" x="750" y="300">Bowtie 2 host depletion</text><text class="body" x="750" y="345">Kraken 2 + Bracken</text><text class="body" x="750" y="390">HUMAnN functions</text>
<rect x="1130" y="140" width="360" height="280" rx="18" fill="#E8F5EF" stroke="#009E73" stroke-width="3"/><circle cx="1190" cy="194" r="29" fill="#009E73"/><text x="1190" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">16</text><text class="heading" x="1240" y="202">16S</text><text class="body" x="1170" y="265">Cutadapt primers</text><text class="body" x="1170" y="315">DADA2 ASVs</text><text class="body" x="1170" y="365">SILVA taxonomy</text>
<rect x="1550" y="140" width="360" height="280" rx="18" fill="#FFF4DD" stroke="#E69F00" stroke-width="3"/><circle cx="1610" cy="194" r="29" fill="#E69F00"/><text x="1610" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#111827">ITS</text><text class="heading" x="1660" y="202">Fungal ITS</text><text class="body" x="1590" y="255">Cutadapt primers</text><text class="body" x="1590" y="300">ITSxpress extraction</text><text class="body" x="1590" y="345">DADA2 ASVs</text><text class="body" x="1590" y="390">fungal taxonomy</text>
<path class="arrow" d="M630 280H675"/>

<!-- C: evidence model -->
<rect class="panel" x="40" y="545" width="1210" height="560" rx="20" filter="url(#shadow)"/><text class="label" x="68" y="593">C</text><text class="heading" x="125" y="591">Two-stage, control-aware evidence model</text>
<rect x="85" y="635" width="340" height="180" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text class="body bold" x="255" y="676" text-anchor="middle">Harmonize taxonomy</text><text class="small" x="255" y="712" text-anchor="middle">standardize taxon names</text><text class="small" x="255" y="742" text-anchor="middle">compare at a jointly supported rank</text><text class="small" x="255" y="772" text-anchor="middle">retain original assignments</text>
<path class="arrow" d="M425 725H478"/>
<rect x="480" y="635" width="340" height="180" rx="16" fill="#E9F4F1" stroke="#009E73" stroke-width="3"/><text class="body bold" x="650" y="676" text-anchor="middle">Stage I · authenticity</text><text x="650" y="724" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-style="italic" fill="#111827">θ<tspan baseline-shift="sub" font-size="18">st</tspan> = logistic(ℓ<tspan baseline-shift="sub" font-size="18">st</tspan>)</text><text class="small" x="650" y="765" text-anchor="middle">detections + power + mapping</text><text class="small" x="650" y="794" text-anchor="middle">− linked-control penalties</text>
<path class="arrow" d="M820 725H873"/>
<rect x="875" y="635" width="330" height="180" rx="16" fill="#F3ECF7" stroke="#CC79A7" stroke-width="3"/><text class="body bold" x="1040" y="676" text-anchor="middle">Stage II · explanation</text><text class="small" x="1040" y="716" text-anchor="middle">ordered decision rules</text><text class="small" x="1040" y="752" text-anchor="middle">status + confidence</text><text class="small" x="1040" y="785" text-anchor="middle">human-readable reason</text>
<rect x="85" y="865" width="1120" height="176" rx="16" fill="#FFF" stroke="#CBD5E1" stroke-width="2"/><text class="small bold" x="115" y="905">Evidence considered for every sample–taxon pair</text><circle cx="130" cy="946" r="8" fill="#0072B2"/><text class="small" x="150" y="953">assay detection and depth</text><circle cx="425" cy="946" r="8" fill="#009E73"/><text class="small" x="445" y="953">quality and detection power</text><circle cx="790" cy="946" r="8" fill="#CC79A7"/><text class="small" x="810" y="953">mapping and rank support</text><circle cx="130" cy="997" r="8" fill="#D55E00"/><text class="small" x="150" y="1004">control prevalence and enrichment</text><circle cx="545" cy="997" r="8" fill="#E69F00"/><text class="small" x="565" y="1004">reference coverage and primer compatibility</text>

<!-- D: outputs -->
<rect class="panel" x="1280" y="545" width="680" height="560" rx="20" filter="url(#shadow)"/><text class="label" x="1308" y="593">D</text><text class="heading" x="1365" y="591">Interpretable outputs</text>
<rect x="1330" y="635" width="580" height="86" rx="14" fill="#E9F4F1" stroke="#009E73" stroke-width="2"/><circle cx="1375" cy="678" r="17" fill="#009E73"/><path d="M1367 678l7 7 13-17" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/><text class="body bold" x="1410" y="672">Concordant</text><text class="small" x="1410" y="700">expected assays support the taxon</text>
<rect x="1330" y="740" width="580" height="86" rx="14" fill="#E8F2FA" stroke="#0072B2" stroke-width="2"/><text x="1375" y="793" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0072B2">↓</text><text class="body bold" x="1410" y="777">Assay-limited</text><text class="small" x="1410" y="805">nondetection expected at available power</text>
<rect x="1330" y="845" width="580" height="86" rx="14" fill="#F3ECF7" stroke="#CC79A7" stroke-width="2"/><text x="1375" y="898" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#CC79A7">≠</text><text class="body bold" x="1410" y="882">Taxonomy-limited</text><text class="small" x="1410" y="910">agreement requires rank roll-up</text>
<rect x="1330" y="950" width="280" height="104" rx="14" fill="#FDEEE8" stroke="#D55E00" stroke-width="2"/><text class="body bold" x="1470" y="991" text-anchor="middle">Control-associated</text><text class="small" x="1470" y="1024" text-anchor="middle">blank or batch signal</text>
<rect x="1630" y="950" width="280" height="104" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text class="body bold" x="1770" y="991" text-anchor="middle">Discordant / unclear</text><text class="small" x="1770" y="1024" text-anchor="middle">reason retained for audit</text><path class="arrow" d="M1250 825H1280"/>
</svg>
