    kind: humann_nucleotide
    version: demo
    path: humann/chocophlan
    required: true
  - id: humann_uniref
    kind: humann_protein
    version: demo
    path: humann/uniref
    required: true
  - id: silva_16s
    kind: dada2_taxonomy
    version: example
    path: marker/16s_taxonomy.fa.gz
    required: true
  - id: unite_its
    kind: dada2_taxonomy
    version: example
    path: marker/its_taxonomy.fa.gz
    required: true
